openapi: 3.0.3
info:
  title: HowMuch Agent API
  version: 1.0.0
  description: Agent-only multimodal product research. No direct search API fallback.
paths:
  /api/research:
    post:
      operationId: researchObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchRequest'
      responses:
        '200':
          description: Evidence-backed agent result
          content:
            application/x-ndjson:
              schema:
                type: string
                description: 'Opt in with Accept: application/x-ndjson. Newline-delimited records: {phase: identifying}, optionally {phase: researching, candidate} when the VLM has identified the product, then {result} or {error}. Legacy upstreams may supply only a final result.'
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchResult'
        '400': { description: Invalid image, cutout, or selection }
        '503': { description: Research agent unavailable }
  /api/jobs:
    post:
      operationId: startResearchJob
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResearchRequest' } } }
      responses:
        '202': { description: Job accepted with jobId and relative status/events URLs }
        '429': { description: Rate or job capacity reached }
  /api/jobs/{jobId}:
    parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getResearchJob
      responses:
        '200': { description: Latest status with optional research result }
        '404': { description: Unknown job or owned by another client }
  /api/jobs/{jobId}/events:
    parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: streamJobEvents
      parameters: [{ name: Last-Event-ID, in: header, schema: { type: integer } }]
      responses:
        '200': { description: Monotonic queued/running/completed or failed job events, content: { text/event-stream: { schema: { type: string } } } }
  /agent/segment:
    post:
      operationId: segmentSelection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageDataUrl]
              properties:
                imageDataUrl: { type: string, pattern: '^data:image/' }
                point: { type: object, properties: { x: {type: number}, y: {type: number} } }
                selection: { $ref: '#/components/schemas/Selection' }
                propagation:
                  type: object
                  description: 'Transfer a previous mask to the current frame. Omit point/selection at the top level.'
                  required: [previousImageDataUrl, selection]
                  properties:
                    previousImageDataUrl: { type: string, pattern: '^data:image/' }
                    selection:
                      type: object
                      required: [polygon]
                      properties:
                        polygon: { $ref: '#/components/schemas/Ring' }
                        contours: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/Ring' } }
      responses:
        '200': { description: All selected masks, with normalized bounds and contour }
        '422': { description: Frame could not be segmented }
        '503': { description: Model unavailable }
  /v1/pairing/sessions:
    post:
      operationId: issuePhoneInvite
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: Desktop-only single-use HTTPS invite with sessionId and expiresAt }
  /v1/pairing/exchange:
    post:
      operationId: exchangePhoneInvite
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [sessionId, token], properties: {sessionId: {type: string}, token: {type: string}} } } }
      responses:
        '200': { description: Secure HttpOnly session cookie issued on phone TLS listener }
        '401': { description: Expired or already used invite }
  /v1/pairing/sessions/{sessionId}:
    parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      operationId: revokeSession
      responses:
        '200': { description: Session revoked by desktop or owning phone }
components:
  schemas:
    Ring:
      type: array
      minItems: 3
      maxItems: 4096
      items: { type: object, required: [x,y], properties: { x: {type: number, minimum: 0, maximum: 1}, y: {type: number, minimum: 0, maximum: 1} } }
    Selection:
      type: object
      required: [x,y,width,height]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1 }
        height: { type: number, exclusiveMinimum: 0, maximum: 1 }
        polygon: { type: array, items: { type: object, required: [x,y], properties: { x: {type: number}, y: {type: number} } } }
    ResearchRequest:
      type: object
      required: [imageDataUrl, cutoutDataUrl, selection, locale]
      properties:
        imageDataUrl: { type: string, pattern: '^data:image/' }
        cutoutDataUrl: { type: string, pattern: '^data:image/' }
        modelHint: { type: string, maxLength: 80, description: 'Model or product name typed by the user; agents verify it against the picture.' }
        labelDataUrl: { type: string, pattern: '^data:image/', description: 'Optional close-up of the same object; only passed to the VLM.' }
        region: { type: string, maxLength: 30, description: 'Korean retail market region; defaults to 전국' }
        selection: { $ref: '#/components/schemas/Selection' }
        locale: { type: string }
    Offer:
      type: object
      required: [title,url,merchant,price,currency,condition,checkedAt,evidence,confidence]
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        merchant: { type: string }
        price: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, enum: [KRW, USD, JPY, EUR] }
        condition: { type: string, enum: [new, used, unknown] }
        shipping: { type: number, minimum: 0 }
        availability: { type: string }
        normalizedPrice: { type: number, minimum: 0 }
        checkedAt: { type: string, format: date-time }
        evidence: { type: array, minItems: 1, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1 }
    ResearchResult:
      type: object
      required: [status,candidates,offers,tools,startedAt,completedAt]
      properties:
        status: { type: string, enum: [complete, completed, partial, followup_required, no_result, research_unavailable, error] }
        pricingMode: { type: string, enum: [exact_model, type_estimate, market_unit], description: 'exact_model: lowest price of one agreed model. type_estimate: model unknown, rough average of >=3 comparable listings (followup asks for the model). market_unit: unit market price for goods where the shop does not matter (food).' }
        estimate:
          type: object
          description: 'Present for type_estimate and market_unit. mean/median/min/max over sampleCount listings (equal to offers.length, at least 3). Never a lowest price of a specific model.'
          required: [mean, median, min, max, currency, sampleCount]
          properties:
            mean: {type: number}
            median: {type: number}
            min: {type: number}
            max: {type: number}
            currency: {type: string, enum: [KRW, USD, JPY, EUR]}
            sampleCount: {type: integer, minimum: 3}
            unit: {type: string, description: 'market_unit only, e.g. kg'}
            region: {type: string}
            observedAt: {type: string}
            note: {type: string}
        followup:
          type: object
          required: [reason, prompt]
          properties: { reason: {type: string, enum: [exact_model_not_visible]}, prompt: {type: string} }
        identity:
          type: object
          required: [brand, model, brandEvidence, modelEvidence]
          properties:
            brand: {type: string}
            model: {type: string}
            brandEvidence: {type: array, items: {type: string}}
            modelEvidence: {type: array, items: {type: string}}
        candidates: { type: array, items: { type: object, required: [name,confidence], properties: { name: {type: string}, brand: {type: string}, model: {type: string}, category: {type: string}, confidence: {type: number, minimum: 0, maximum: 1} } } }
        offers: { type: array, items: { $ref: '#/components/schemas/Offer' } }
        lowest: { oneOf: [{type: string}, {$ref: '#/components/schemas/Offer'}] }
        highest: { oneOf: [{type: string}, {$ref: '#/components/schemas/Offer'}] }
        representative: { type: object, properties: { min: {type: number}, max: {type: number}, median: {type: number}, currency: {type: string} } }
        tools: { type: array, items: {type: string} }
        queries: { type: array, items: {type: string} }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
